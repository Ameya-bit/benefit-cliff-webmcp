<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap">
  <style>
    body { margin: 0; font-family: "Inter", system-ui, sans-serif; }
    a { color: #6b6459; } a:hover { color: #1f1b16; }
  </style>
</helmet>
<div style="width: 1300px; height: 620px; box-sizing: border-box; background: #f3efe7; color: #1f1b16; padding: 20px 26px; display: flex; flex-direction: column; gap: 10px; font-size: 15px; line-height: 1.5;">
  <div style="display: flex; align-items: baseline; gap: 14px;">
    <h2 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 24px; letter-spacing: -0.01em;">Cliff treatment A — pills only</h2>
    <span style="font-family: 'Newsreader', Georgia, serif; font-style: italic; font-size: 15px; color: #6b6459;">what ships today, refined: the worst cliff arrives filled</span>
  </div>
  <div style="background: #fbf8f2; border: 1px solid #e9e3d5; border-radius: 14px; box-shadow: 0 1px 2px rgba(31, 27, 22, 0.05); padding: 12px 18px 10px;">
    <svg viewBox="0 0 1240 460" style="width: 100%; display: block;">
      <!--INC:parts/chart-study.svg-->
      <g>
        <line x1="430.4" y1="42" x2="430.4" y2="428" stroke="#2563eb" stroke-width="1.6" opacity="0.9"/>
        <circle cx="430.4" cy="180.3" r="5.5" fill="#2563eb" stroke="#fbf8f2" stroke-width="2"/>
        <text x="430.4" y="36" text-anchor="middle" font-size="13" font-weight="600" fill="#2563eb" stroke="#fbf8f2" stroke-width="3.5" paint-order="stroke">you — $32k</text>
      </g>
      <!-- worst: filled, and names its program right on the pill -->
      <g>
        <line x1="652.7" y1="118" x2="652.7" y2="143" stroke="#cc3b3b" stroke-width="0.9" stroke-dasharray="3 3" opacity="0.55"/>
        <circle cx="652.7" cy="143" r="4" fill="#cc3b3b"/>
        <rect x="582.7" y="97.5" width="140" height="21" rx="10.5" fill="#cc3b3b"/>
        <text x="652.7" y="112" text-anchor="middle" font-size="12.5" font-weight="600" fill="#fbf8f2">▼ $15k · childcare</text>
      </g>
      <g>
        <line x1="500.6" y1="152" x2="500.6" y2="166.4" stroke="#cc3b3b" stroke-width="0.9" stroke-dasharray="3 3" opacity="0.55"/>
        <circle cx="500.6" cy="166.4" r="4" fill="#cc3b3b"/>
        <rect x="464.6" y="131.5" width="72" height="21" rx="10.5" fill="rgba(204,59,59,0.07)" stroke="#cc3b3b" stroke-width="0.8"/>
        <text x="500.6" y="146" text-anchor="middle" font-size="12.5" font-weight="600" fill="#cc3b3b">▼ $4.1k</text>
      </g>
      <g>
        <line x1="828.2" y1="150" x2="828.2" y2="163.8" stroke="#cc3b3b" stroke-width="0.9" stroke-dasharray="3 3" opacity="0.55"/>
        <circle cx="828.2" cy="163.8" r="4" fill="#cc3b3b"/>
        <rect x="792.2" y="129.5" width="72" height="21" rx="10.5" fill="rgba(204,59,59,0.07)" stroke="#cc3b3b" stroke-width="0.8"/>
        <text x="828.2" y="144" text-anchor="middle" font-size="12.5" font-weight="600" fill="#cc3b3b">▼ $2.8k</text>
      </g>
    </svg>
  </div>
  <div style="display: flex; gap: 24px; font-size: 12.5px; color: #6b6459; padding: 0 4px;">
    <span><b style="font-weight: 600; color: #1f1b16;">Motivation:</b> quiet sky, maximum data-ink — Tufte would approve.</span>
    <span><b style="font-weight: 600; color: #1f1b16;">Change from today:</b> the worst pill is filled and named; the rest stay outlined.</span>
    <span style="margin-left: auto;"><b style="font-weight: 600; color: #1f1b16;">Tradeoff:</b> the width of each drop is not visible until you hover.</span>
  </div>
</div>
</x-dc>
</body>
</html>
