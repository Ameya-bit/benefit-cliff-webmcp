[project]
name = "peira-backend"
version = "0.1.0"
description = "Peira backend: FastAPI wrapper around policyengine-us for benefits-cliff probing"
requires-python = ">=3.12"
dependencies = [
    "policyengine-us==1.821.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
