services:
  - type: web
    name: peira-backend
    runtime: python
    plan: standard # 2GB RAM — policyengine-us peaks ~1.2GB RSS; free tier (512MB) OOMs
    region: oregon
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen --no-dev
    # --proxy-headers: behind Render's proxy, request.client must come from
    # X-Forwarded-For or per-client rate limits treat every visitor as one.
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /health
    envVars:
      - key: PEIRA_ALLOWED_ORIGINS
        value: https://peira.netlify.app,http://localhost:5173
