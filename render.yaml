services:
  - type: web
    name: peira-backend
    runtime: python
    plan: standard # 2GB RAM — policyengine-us peaks ~1.2GB RSS; free tier (512MB) OOMs
    region: oregon
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen --no-dev
    # No --proxy-headers: blanket-trusting X-Forwarded-For would let clients
    # forge their identity (uvicorn takes the leftmost, client-supplied hop).
    # The rate limiter reads the rightmost XFF entry itself (main.py).
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PEIRA_ALLOWED_ORIGINS
        value: https://peira.netlify.app,http://localhost:5173
